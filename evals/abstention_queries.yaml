# Abstention eval set. Both directions, in one file.
#
# The corpus is customer-support tickets: technical and IT support, product
# support, billing, returns, outages, pre-sales, HR, general inquiry - across
# smart-home devices, marketing software, cloud infrastructure, projectors and
# e-commerce. Nothing here should have a usable precedent in it.
#
# expect: no_precedent  - off topic, the tool should abstain
# expect: precedent      - on topic, the tool should find something
#
# Both sides are handwritten on purpose. An earlier version of this file held only
# negatives, and that hid a confound: handwritten text scores lower than the
# corpus's generated text regardless of topic, so a set of handwritten negatives
# measures provenance as much as it measures relevance. The handwritten positives
# below are the control that exposes it - they are unambiguously on topic and
# still score well below real tickets.
#
# Deliberately included are cases that are *shaped* like support tickets but sit
# in a domain the corpus has never seen (tractor_hydraulics, bike_brakes). Those
# are the hard ones: fluent problem reports with no precedent behind them, which
# is exactly the failure mode abstention exists to catch. bike_brakes is the
# closest to in-domain and is the one most likely to be answered wrongly.
#
# Adding a case is one entry.

- id: recipe_braise
  lang: en
  expect: no_precedent
  query: "How long should I braise a beef shank, and do I need to sear it first?"
  note: cooking - no food or recipe content in the corpus

- id: weather_forecast
  lang: en
  expect: no_precedent
  query: "Will it rain in Barcelona next Tuesday afternoon?"
  note: weather - no forecasting content, and no dates in the corpus at all

- id: garden_tomatoes
  lang: en
  expect: no_precedent
  query: "My tomato plants have yellow leaves with brown spots near the bottom."
  note: horticulture - problem-shaped, but no gardening domain

- id: cat_not_eating
  lang: en
  expect: no_precedent
  query: "My cat has stopped eating dry food but still eats wet food. Two days now."
  note: pet care - no animal or veterinary content

- id: tractor_hydraulics
  lang: en
  expect: no_precedent
  query: "The hydraulic pump on my tractor is leaking fluid near the coupling."
  note: heavy machinery - support-shaped equipment fault, wrong domain entirely

- id: vaccine_schedule
  lang: en
  expect: no_precedent
  query: "What is the recommended vaccination schedule for a six-month-old?"
  note: clinical advice - the corpus has medical *data storage*, never medicine

- id: landlord_rent
  lang: en
  expect: no_precedent
  query: "Can my landlord raise the rent mid-lease if the building changes owner?"
  note: tenancy law - no legal content

- id: world_cup_1998
  lang: en
  expect: no_precedent
  query: "Who won the 1998 World Cup final and what was the score?"
  note: sports trivia - factual lookup with no corpus grounding

- id: sea_shanty
  lang: en
  expect: no_precedent
  query: "Write a short poem about the sea in the style of a sea shanty."
  note: creative writing - not a question about anything in the corpus

- id: quadratic
  lang: en
  expect: no_precedent
  query: "Solve for x: 3x squared minus 12x plus 9 equals zero."
  note: mathematics - no computational or tutoring content

- id: rome_airport
  lang: en
  expect: no_precedent
  query: "What is the cheapest way to get from Rome city centre to Fiumicino airport?"
  note: travel logistics - no travel domain

- id: bronze_age
  lang: en
  expect: no_precedent
  query: "Why did the Bronze Age collapse happen around 1177 BC?"
  note: history - no historical content

- id: squat_rest_days
  lang: en
  expect: no_precedent
  query: "How many rest days should I take between heavy squat sessions?"
  note: fitness training - no health or exercise content

- id: sauerteig
  lang: de
  expect: no_precedent
  query: "Wie lange muss ein Sauerteigbrot gehen, bevor ich es backe?"
  note: baking - German off-topic control

- id: zimmerpflanze
  lang: de
  expect: no_precedent
  query: "Meine Zimmerpflanze verliert Blätter, obwohl ich sie regelmäßig gieße."
  note: houseplants - problem-shaped in German, no corpus domain

- id: vitamin_d
  lang: de
  expect: no_precedent
  query: "Welche Dosis Vitamin D wird für Erwachsene im Winter empfohlen?"
