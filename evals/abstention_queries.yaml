  note: history in German

# ---------------------------------------------------------------------------
# Handwritten, unambiguously ON topic. Every one of these has obvious coverage
# in the corpus, so a tool that abstains on them is wrong. They are the control
# for the provenance effect: written by a person, not by the corpus generator.
# ---------------------------------------------------------------------------

- id: duplicate_charge
  lang: en
  expect: precedent
  query: "I was charged twice for my subscription this month and need a refund for the duplicate."
  note: billing - the corpus has a Billing and Payments queue of 4,000 tickets

- id: login_reset_email
  lang: en
  expect: precedent
  query: "I cannot log into my account, the password reset email never arrives."
  note: account access - heavily represented

- id: projector_flicker
