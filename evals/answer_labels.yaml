# Adjudicated labels for the `answer` field, used to measure any bulk classifier
# before it is trusted on all 39,739 indexable tickets.
#
# Sampled 2 tickets per (queue x language) so small queues and German are not
# swamped by Technical Support English. Each was read in full and labelled by the
# criterion below. These are careful reads, not a crowd consensus - correct
# anything that looks wrong, the file is the reference and it should be argued
# with.
#
#   resolution           the answer actually answers: substantive, specific,
#                        actionable without a further round trip
#   information_request  cannot proceed until the customer supplies something
#                        specific (logs, account number, error text, config)
#   acknowledgement      received / working on it / will call - no substance and
#                        no specific ask
#   not_a_support_reply  the text is not a support reply at all. Usually it reads
#                        customer-side ("I am writing to report..."), or it tells
#                        the reporter to go investigate their own ticket.
#
# The last class is the one that matters most: those rows are unusable as
# precedent, and the role-confusion filter in pipeline/03_filter.py does not
# catch them because it only inspects the body, never the answer.

- {id: multilang_v2:5504, label: information_request, ask_is_specific: true}
- {id: multilang_v1:13, label: resolution}
- {id: multilang_v1:10485, label: resolution}
- {id: multilang_v1:2631, label: acknowledgement}
