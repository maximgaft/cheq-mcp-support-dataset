# Held-out check for the abstention floor. Nothing here is used to fit anything:
# pipeline/07_calibrate.py sets the floor from evals/abstention_queries.yaml and
# 400 validation tickets, then scores these queries at that floor and reports the
# result as out-of-sample evidence.
#
# Provenance: drafted with an AI assistant after the floor was fixed, reviewed by
# hand, and checked to share no query with the fitting set. 25 off-topic (20
# trivia-shaped questions and 5 fault reports in domains the corpus does not
# cover, the shape the fitting set calls its hard cases) and 15 on-topic typed
# questions in generic IT-support phrasing, not tuned to the corpus vocabulary.
# 32 English, 8 German.
#
# expect: no_precedent  - off topic, the tool should abstain
# expect: precedent      - on topic, the tool should find something
- query: "How long should I boil an egg for a runny yolk?"
  expect: no_precedent
- query: "What is the capital of Mongolia?"
  expect: no_precedent
- query: "Write me a haiku about autumn rain."
