[project]
name = "cheq"
version = "0.1.0"
description = "This is a home assignment — MCP server for CHEQ"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "mcp>=2.1.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.1",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
