[project]
name = "cheq"
version = "0.1.0"
description = "This is a home assignment — MCP server for CHEQ"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.3.0",
    "certifi>=2026.7.22",
    "duckdb>=1.5.5",
    "mcp>=2.1.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.1",
    "torch>=2.13.0,<2.14",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.5",
]

# torch from PyPI drags ~2 GB of CUDA wheels onto Linux and Windows; nothing here
# uses a GPU. Take the CPU build there; macOS keeps the PyPI wheel (no CUDA deps).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60   # a broken watchdog must fail the suite, not hang it
